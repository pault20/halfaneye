<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="A single Euglena cell with its flagellum, stigma and light sensor labelled, and four end-on views showing the stigma shading the sensor once per roll">
<style>
.cell{fill:var(--raised, #fbfcfa);stroke:var(--ink, #172026);stroke-width:2;stroke-linejoin:round}
.line{fill:none;stroke:var(--ink, #172026);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:var(--ink, #172026);stroke-width:1}
.pig{fill:var(--ink, #172026);stroke:none}
.sens{fill:var(--part-2, #0d7480);stroke:var(--part-2, #0d7480);stroke-width:1.5}
.sensoff{fill:var(--raised, #fbfcfa);stroke:var(--part-2, #0d7480);stroke-width:2}
.fl{fill:none;stroke:var(--ink, #172026);stroke-width:2;stroke-linecap:round}
.light{fill:none;stroke:var(--muted, #4a5860);stroke-width:1.5;stroke-dasharray:3 3}
.lighthead{fill:none;stroke:var(--muted, #4a5860);stroke-width:1.5;stroke-linejoin:round}
.lead{fill:none;stroke:var(--ink, #172026);stroke-width:0.9;stroke-linecap:round}
.halo{fill:none;stroke:var(--sunk, #e8ece6);stroke-width:3;stroke-linecap:round}
.rule{fill:none;stroke:var(--rule, #cfd7d2);stroke-width:1}
.lab{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.labb{font:600 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.labp{font:600 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--part-2, #0d7480)}
.tag{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--part-2, #0d7480)}
.mut{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--muted, #4a5860)}
.pl{font:500 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.foot{font:400 12px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--muted, #4a5860)}
</style>
<text class="pl" x="10" y="22">(a)</text>
