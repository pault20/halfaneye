<path class="halo" d="M198 104 L236 58"/><path class="lead" d="M198 104 L236 58"/><text class="lab" x="240" y="62" text-anchor="start">Stigma (eyespot): a shade,</text><text class="lab" x="240" y="77" text-anchor="start">not a light sensor</text>
<path class="halo" d="M196 125 L236 176"/><path class="lead" d="M196 125 L236 176"/><text class="labp" x="240" y="180" text-anchor="start">Paraflagellar body:</text><text class="labp" x="240" y="195" text-anchor="start">the light sensor</text>
<path class="halo" d="M88 118 L72 160"/><path class="lead" d="M88 118 L72 160"/><text class="lab" x="68" y="164" text-anchor="end">Flagellum</text>
<text class="foot" x="630" y="205" text-anchor="end">Front end on the left · stigma and sensor enlarged</text>
<path class="rule" d="M10 222 L630 222"/>
