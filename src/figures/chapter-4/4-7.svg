<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Five mollusc eyes: limpet open pit, abalone narrowed pit, nautilus pinhole; land snail weak lens, periwinkle sharp lens">
<style>
.wall{fill:none;stroke:var(--ink, #172026);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pig{fill:none;stroke:var(--ink, #172026);stroke-width:6;stroke-linejoin:round;stroke-linecap:butt}
