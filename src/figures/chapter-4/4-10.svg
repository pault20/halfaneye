<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Bar chart: generations for each of seven model transitions, 35,000 to 72,000, about 364,000 in all">
<style>
.grid{fill:none;stroke:var(--rule, #cfd7d2);stroke-width:1}
.axis{fill:none;stroke:var(--ink, #172026);stroke-width:1.2}
.tick{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);font-variant-numeric:tabular-nums;fill:var(--muted, #4a5860)}
.ttl{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.bar{fill:var(--muted, #4a5860);stroke:none}
.val{font:500 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);font-variant-numeric:tabular-nums;fill:var(--ink, #172026)}
.line{fill:none;stroke:var(--ink, #172026);stroke-width:1.5;stroke-dasharray:3 4}
.pt{fill:var(--ink, #172026);stroke:none}
.stg{font:400 12px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.note{font:400 12px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--muted, #4a5860)}
</style>
<path class="grid" d="M78 296.0 L616 296.0"/>
<text class="tick" x="70" y="300.0" text-anchor="end">0</text>
<path class="grid" d="M78 229.0 L616 229.0"/>
<text class="tick" x="70" y="233.0" text-anchor="end">20</text>
<path class="grid" d="M78 162.0 L616 162.0"/>
<text class="tick" x="70" y="166.0" text-anchor="end">40</text>
<path class="grid" d="M78 95.0 L616 95.0"/>
<text class="tick" x="70" y="99.0" text-anchor="end">60</text>
<path class="grid" d="M78 28.0 L616 28.0"/>
<text class="tick" x="70" y="32.0" text-anchor="end">80</text>
<rect class="bar" x="94.9" y="178.7" width="43.0" height="117.3"/>
<text class="val" x="116.4" y="172.7" text-anchor="middle">35,000</text>
<text class="tick" x="116.4" y="314.0" text-anchor="middle">1→2</text>
<rect class="bar" x="171.8" y="54.7" width="43.0" height="241.3"/>
<text class="val" x="193.3" y="48.7" text-anchor="middle">72,000</text>
<text class="tick" x="193.3" y="314.0" text-anchor="middle">2→3</text>
<rect class="bar" x="248.6" y="116.0" width="43.0" height="180.0"/>
<text class="val" x="270.1" y="110.0" text-anchor="middle">54,000</text>
<text class="tick" x="270.1" y="314.0" text-anchor="middle">3→4</text>
<rect class="bar" x="325.5" y="146.0" width="43.0" height="150.0"/>
<text class="val" x="347.0" y="140.0" text-anchor="middle">45,000</text>
<text class="tick" x="347.0" y="314.0" text-anchor="middle">4→5</text>
<rect class="bar" x="402.3" y="168.0" width="43.0" height="128.0"/>
<text class="val" x="423.9" y="162.0" text-anchor="middle">38,000</text>
<text class="tick" x="423.9" y="314.0" text-anchor="middle">5→6</text>
<rect class="bar" x="479.2" y="90.7" width="43.0" height="205.3"/>
<text class="val" x="500.7" y="84.7" text-anchor="middle">61,000</text>
<text class="tick" x="500.7" y="314.0" text-anchor="middle">6→7</text>
<rect class="bar" x="556.1" y="98.7" width="43.0" height="197.3"/>
<text class="val" x="577.6" y="92.7" text-anchor="middle">59,000</text>
<text class="tick" x="577.6" y="314.0" text-anchor="middle">7→8</text>
<path class="axis" d="M78 296.0 L616 296.0"/>
<text class="ttl" x="347.0" y="336" text-anchor="middle">Transition between model stages</text>
<text class="ttl" transform="translate(24 162.0) rotate(-90)" text-anchor="middle">Generations (thousands)</text>
<text class="note" x="616" y="354" text-anchor="end">Total 363,992 generations (Nilsson and Pelger 1994). Bars: our arithmetic at 0.005% per generation.</text>
</svg>
