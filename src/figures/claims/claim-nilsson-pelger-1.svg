<text class="stg" x="94.0" y="291.0">Stage 1</text>
<circle class="pt" cx="125.3" cy="255.7" r="4"/>
<text class="stg" x="118.3" y="247.7" text-anchor="end">Stage 2</text>
<circle class="pt" cx="222.7" cy="215.3" r="4"/>
<text class="stg" x="215.7" y="207.3" text-anchor="end">Stage 3</text>
<circle class="pt" cx="295.4" cy="175.0" r="4"/>
