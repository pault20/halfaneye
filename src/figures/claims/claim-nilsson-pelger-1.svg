<text class="ttl" x="347.0" y="336" text-anchor="middle">Progress through the model (steps of 1%)</text>
<text class="ttl" transform="translate(24 162.0) rotate(-90)" text-anchor="middle">Image points resolved (log scale)</text>
<text class="note" x="616" y="354" text-anchor="end">Approximate values read from Nilsson and Pelger (1994), Fig. 3.</text>
