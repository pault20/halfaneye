<text class="tick" x="70" y="206.3" text-anchor="end">5</text>
<path class="grid" d="M78 162.0 L616 162.0"/>
<text class="tick" x="70" y="166.0" text-anchor="end">10</text>
<path class="grid" d="M78 121.7 L616 121.7"/>
<text class="tick" x="70" y="125.7" text-anchor="end">20</text>
<path class="grid" d="M78 68.3 L616 68.3"/>
<text class="tick" x="70" y="72.3" text-anchor="end">50</text>
<path class="grid" d="M78 28.0 L616 28.0"/>
<text class="tick" x="70" y="32.0" text-anchor="end">100</text>
<text class="tick" x="78.0" y="314" text-anchor="middle">0</text>
<text class="tick" x="212.5" y="314" text-anchor="middle">500</text>
<text class="tick" x="347.0" y="314" text-anchor="middle">1,000</text>
<text class="tick" x="481.5" y="314" text-anchor="middle">1,500</text>
<text class="tick" x="616.0" y="314" text-anchor="middle">2,000</text>
<path class="axis" d="M78 296 L616 296"/>
<path class="axis" d="M78 28 L78 296"/>
<path class="line" d="M78.0 296.0 L125.3 255.7 L222.7 215.3 L295.4 175.0 L355.9 118.8 L407.5 84.3 L490.4 46.3"/>
