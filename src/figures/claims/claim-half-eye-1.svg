<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-label="Six eyes in a row, from a one-cell eyespot through cup, pinhole and blurred lens to a focused camera eye, each named with its animal">
<style>
.cell{fill:none;stroke:var(--ink, #172026);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cellf{fill:var(--raised, #fbfcfa);stroke:var(--ink, #172026);stroke-width:2}
.nuc{fill:none;stroke:var(--ink, #172026);stroke-width:1.5}
.thin{fill:none;stroke:var(--ink, #172026);stroke-width:1}
.pig{fill:var(--ink, #172026);stroke:none}
.pigs{fill:none;stroke:var(--ink, #172026);stroke-width:6;stroke-linejoin:round;stroke-linecap:butt}
.ret{fill:none;stroke:var(--part-2, #0d7480);stroke-width:6;stroke-linejoin:round;stroke-linecap:butt}
.mv{fill:none;stroke:var(--part-2, #0d7480);stroke-width:2;stroke-linecap:round}
.rh{fill:none;stroke:var(--part-2, #0d7480);stroke-width:6;stroke-linecap:round}
.rl{fill:none;stroke:var(--part-2, #0d7480);stroke-width:6;stroke-linecap:butt}
.lens{fill:var(--part-2-tint, #dcecee);stroke:var(--part-2, #0d7480);stroke-width:2}
.lens2{fill:var(--part-2, #0d7480);fill-opacity:0.25;stroke:none}
.iris{fill:none;stroke:var(--ink, #172026);stroke-width:6;stroke-linecap:round}
.cil{fill:none;stroke:var(--ink, #172026);stroke-width:2;stroke-linecap:round}
.light{fill:none;stroke:var(--muted, #4a5860);stroke-width:1.5;stroke-dasharray:3 3}
.lighthead{fill:none;stroke:var(--muted, #4a5860);stroke-width:1.5;stroke-linejoin:round}
.rule{fill:none;stroke:var(--rule, #cfd7d2);stroke-width:1}
.num{font:600 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.eye{font:500 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.ani{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--ink, #172026)}
.job{font:400 13px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--muted, #4a5860)}
.tag{font:400 12px var(--font-sans, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif);fill:var(--muted, #4a5860)}
</style>

